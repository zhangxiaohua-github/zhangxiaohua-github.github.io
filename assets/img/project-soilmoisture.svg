<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#f2f4f8"/>
  <text x="320" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6572">Soil moisture inversion mosaic (placeholder)</text>

  <!-- four map tiles -->
  <g>
    <rect x="60" y="55" width="245" height="120" fill="#d8e9d0" stroke="#e6e4de"/>
    <rect x="335" y="55" width="245" height="120" fill="#cfe3c2" stroke="#e6e4de"/>
    <rect x="60" y="185" width="245" height="120" fill="#c2dbb2" stroke="#e6e4de"/>
    <rect x="335" y="185" width="245" height="120" fill="#b5d3a4" stroke="#e6e4de"/>
    <!-- water bodies -->
    <ellipse cx="150" cy="105" rx="34" ry="16" fill="#7fb8e0"/>
    <ellipse cx="430" cy="235" rx="40" ry="18" fill="#7fb8e0"/>
    <path d="M335 90 q 60 26 120 8 t 125 16" fill="none" stroke="#7fb8e0" stroke-width="6" stroke-linecap="round"/>
    <!-- houses -->
    <rect x="230" y="215" width="12" height="10" fill="#c96b4a"/>
    <rect x="250" y="222" width="12" height="10" fill="#c96b4a"/>
    <rect x="500" y="95" width="12" height="10" fill="#c96b4a"/>
    <text x="120" y="72" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6572">Date 1</text>
    <text x="395" y="72" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6572">Date 2</text>
    <text x="120" y="202" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6572">Date 3</text>
    <text x="395" y="202" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6572">Date 4</text>
  </g>

  <!-- legend -->
  <g transform="translate(60, 318)" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6572">
    <rect x="0" y="-9" width="11" height="9" fill="#c96b4a"/><text x="16" y="0">Houses</text>
    <rect x="72" y="-9" width="11" height="9" fill="#7fb8e0"/><text x="88" y="0">Lakes / Rivers</text>
    <rect x="185" y="-9" width="60" height="9" fill="url(#grad)"/><text x="250" y="0">Soil moisture (low → high)</text>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f0dc"/>
      <stop offset="1" stop-color="#4a7c2f"/>
    </linearGradient>
  </defs>
  <text x="320" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8b94a1">Replace with original high-resolution figure</text>
</svg>
